# Full training config — RTX A5000 24GB GPU
# Run: bash run_training.sh phase1_quantum/configs/full_config.yaml "3xor,5xor"

data_dir:    "data"
output_dir:  "results"
n_bits:      64
n_qubits:    8
n_layers:    6
batch_size:  4096

# Adam optimizer
lr_joint:              5.0e-4
early_stop_patience:   12
ga_generations:        60       # reused as epoch count

# max_train_samples: 0 = use ALL data (GPU can handle it)
max_train_samples:     0
