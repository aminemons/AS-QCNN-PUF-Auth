# Full training config — RTX A5000 24GB — target 3-4 hours total
# Run: python phase1_quantum/02_train_qcnn.py --config phase1_quantum/configs/full_config.yaml

data_dir:    "data"
output_dir:  "results"
n_bits:      64
n_qubits:    8
n_layers:    6
batch_size:  4096
num_workers: 8

# Training phases
epochs_warmup: 10
epochs_joint:  70
lr_warmup:     1.0e-3
lr_joint:      5.0e-5
lr_vqc:        1.0e-3
weight_decay:  1.0e-4
lambda_ent:    0.005
early_stop_patience: 15
