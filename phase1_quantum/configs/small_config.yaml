# Quick smoke-test config — completes in ~5 minutes on CPU
# Run: python phase1_quantum/02_train_qcnn.py --config phase1_quantum/configs/small_config.yaml

data_dir:    "data"
output_dir:  "results"
n_bits:      64
n_qubits:    8
n_layers:    3
batch_size:  512
num_workers: 2

# Training
epochs_warmup: 2
epochs_joint:  5
lr_warmup:     1.0e-3
lr_joint:      1.0e-4
lr_vqc:        5.0e-3
weight_decay:  1.0e-4
lambda_ent:    0.01
early_stop_patience: 5
